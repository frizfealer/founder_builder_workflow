phase_result:
  status: complete

  artifact_changes:
    - artifact: product-sense.md
      scope: all sections (new artifact)
      summary: >
        First authoritative Product Sense for the Sunrise Café reservation agent,
        drafted from product-idea.md as sole authoritative input. Business & Domain
        Rules states no specific café rule, and Failure & Recovery leaves the
        simulation-disclosure question explicitly open.

  issues:
    - id: I-001
      statement: >
        What "simulated" commits the product to is undecided — whether the visitor must
        be told the reservation is simulated, and what a confirmation may claim about
        that reservation's standing at the café.
      evidence: >
        The Product Idea says "a simulated reservation" and nothing more. Failure &
        Recovery must state what the product may never claim, and that line cannot be
        written without knowing whether an undisclosed simulated confirmation is a
        false claim or an accepted product boundary.
      affected_phase: P0
      uncertainty: true
      blocks_current_phase: false

    - id: I-002
      statement: >
        The content of Sunrise Café's booking rules is not provided by any authoritative
        input, so Business & Domain Rules cannot state what makes a reservation outcome
        correct.
      evidence: >
        The Product Idea names "the café's booking rules" as something the visitor must
        not need to understand, which makes holding and applying them a core product
        responsibility, but states none of them. No business or domain context exists in
        examples/sunrise-cafe/.
      affected_phase: P0
      uncertainty: true
      blocks_current_phase: false

    - id: I-003
      statement: >
        What a reservation request must specify beyond a time is undecided, so the input
        the availability check evaluates against is undefined.
      evidence: >
        "Find an available table" implies a time, which is derivable. Anything further —
        party size most obviously — depends on table semantics the Product Idea does not
        establish, and the traceability rule forbids introducing table capacity here.
      affected_phase: P0
      uncertainty: true
      blocks_current_phase: false

  invalidates: []
