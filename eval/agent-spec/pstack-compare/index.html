<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean Policy Charts</title>
<style>
  :root { --bg: #ffffff; --fg: #1c1c1c; --muted: #656565; --border: #d6d6d6; --panel: #fafafa; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a8a8a8; --border: #3a3a3a; --panel: #222222; }
  }
  :root[data-theme="dark"] { --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a8a8a8; --border: #3a3a3a; --panel: #222222; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); max-width: 70ch; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  figure { margin: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--panel);
           padding: 12px; min-width: 0; }
  figcaption { font-weight: 600; margin-bottom: 4px; }
  figcaption small { display: block; font-weight: 400; color: var(--muted); }
  .chart { overflow: auto; max-height: 85vh; }
  .chart img { display: block; width: 100%; height: auto; min-width: 520px; }
  a { color: inherit; }
</style>
</head>
<body>
<h1>Harbor Goods clean policy: two charts of one model</h1>
<p class="sub">Both are drawn from the 9,031 states of the clean policy and rendered with Pele 1.9.0.
  Each has 13 states and 22 arrows. Click a chart to open it full size.</p>
<div class="grid">
  <figure>
    <figcaption>Ours
      <small><code>new-format/seeded-clean/chart.mmd</code>, from <code>grader/check.py --write</code></small>
    </figcaption>
    <div class="chart"><a href="charts/ours-clean.svg"><img src="charts/ours-clean.svg" alt="Our chart of the clean policy"></a></div>
  </figure>
  <figure>
    <figcaption>pstack statechart
      <small><code>clean/run-view/chart.mmd</code>, from TLC with <code>clean/view.mjs</code> (chart budget raised from 500 to 10,000 on a copy)</small>
    </figcaption>
    <div class="chart"><a href="charts/pstack-clean.svg"><img src="charts/pstack-clean.svg" alt="pstack's chart of the clean policy"></a></div>
  </figure>
</div>
</body>
</html>
