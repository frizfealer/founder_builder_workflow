[project]
name = "<product>-bdd"
version = "0"
description = "BDD tests for the <product> agent spec, from the agent-spec-to-pytest-bdd skill"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "pytest-bdd>=9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
